name: Deploy preview

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Validate Linear ticket branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- branch-name-policy -->'
          message='Branch name must be the Linear ticket ID, for example SIS-10.'
          comment_id=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- branch-name-policy -->"))) | .id' \
            | head -n 1)

          if [[ "$BRANCH_NAME" =~ ^SIS-[1-9][0-9]*$ ]]; then
            if [[ -n "$comment_id" ]]; then
              gh api --method DELETE "repos/${GH_REPO}/issues/comments/${comment_id}"
            fi
            echo "Branch name is valid: ${BRANCH_NAME}"
            exit 0
          fi

          body=$(printf '%s\n\n%s' "$marker" "$message")
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
          echo "::error::${message} Current branch: ${BRANCH_NAME}"
          exit 1

      - name: Validate preview eligibility
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRAFT" == "true" ]]; then
            echo "::error::Preview deployment is unavailable for draft pull requests."
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::Preview deployment is limited to branches in ${BASE_REPO}."
            exit 1
          fi
          echo "PR is eligible for preview deployment."

  build-preview:
    name: Internal / Build preview
    needs: validate-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout approved PR revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build credential-free Worker bundle
        run: npx wrangler deploy --dry-run --outdir preview-bundle

      - name: Validate artifact before upload
        shell: python
        run: |
          from pathlib import Path

          roots = [Path("preview-bundle"), Path("dist")]
          worker = roots[0] / "worker.js"
          if not worker.is_file() or worker.is_symlink():
              raise SystemExit("Expected a regular preview-bundle/worker.js")
          if not roots[1].is_dir() or roots[1].is_symlink():
              raise SystemExit("Expected a regular dist directory")

          paths = [path for root in roots for path in root.rglob("*")]
          if any(path.is_symlink() for path in paths):
              raise SystemExit("Symlinks are not allowed in preview artifacts")
          files = [path for path in paths if path.is_file()]
          if len(files) > 5000:
              raise SystemExit("Preview artifact contains too many files")
          if sum(path.stat().st_size for path in files) > 50 * 1024 * 1024:
              raise SystemExit("Preview artifact exceeds 50 MiB")

          print(f"Validated {len(files)} regular files before upload")

      - name: Upload credential-free preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview-bundle/worker.js
            dist/
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Internal / Publish preview
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: branch-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted deployment configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install trusted deployment dependencies
        run: npm ci --ignore-scripts

      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-artifact

      - name: Validate artifact boundary
        shell: python
        run: |
          from pathlib import Path

          root = Path("preview-artifact").resolve()
          worker = root / "preview-bundle" / "worker.js"
          assets = root / "dist"

          if not worker.is_file() or worker.is_symlink():
              raise SystemExit("Expected a regular preview-bundle/worker.js")
          if not assets.is_dir() or assets.is_symlink():
              raise SystemExit("Expected a regular dist directory")

          files = [path for path in root.rglob("*") if path.is_file()]
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("Symlinks are not allowed in preview artifacts")
          if len(files) > 5000:
              raise SystemExit("Preview artifact contains too many files")
          if sum(path.stat().st_size for path in files) > 50 * 1024 * 1024:
              raise SystemExit("Preview artifact exceeds 50 MiB")

          print(f"Validated {len(files)} regular files")

      - name: Revalidate approved PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.state')
          current_sha=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [[ "$state" == "open" ]]
          [[ "$current_sha" == "$EXPECTED_SHA" ]]
          echo "PR #${PR_NUMBER} is open at approved SHA ${EXPECTED_SHA}"

      - name: Derive stable preview alias
        id: preview
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PREVIEW_WORKER_NAME: __PREVIEW_WORKER__
        shell: bash
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed -E 's/^-+//; s/-+$//' | cut -c1-20 | sed -E 's/-+$//')
          if [[ -z "$slug" ]]; then
            slug=branch
          elif [[ ! "$slug" =~ ^[a-z] ]]; then
            slug="b-${slug}"
          fi
          hash=$(printf '%s' "$HEAD_REF" | shasum -a 256 | cut -c1-8)
          preview_alias="pr-${{ github.event.pull_request.number }}-${slug}-${hash}"
          [[ "$preview_alias" =~ ^pr-[0-9]+-[a-z][a-z0-9-]*-[a-f0-9]{8}$ ]]
          [[ ${#preview_alias} -le 46 ]]
          [[ $((${#preview_alias} + 1 + ${#PREVIEW_WORKER_NAME})) -le 63 ]]
          echo "preview_alias=$preview_alias" >> "$GITHUB_OUTPUT"

      - name: Verify isolated preview Worker has no secrets
        id: preview-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_NAME: __PREVIEW_WORKER__
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/preview-worker-secrets.json"
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER_NAME}/secrets" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          if [[ "$status" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Preview Worker does not exist yet; trusted bootstrap is required."
          elif [[ "$status" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            python3 - "$response" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare secret-list request was not successful")
          secrets = payload.get("result", [])
          if secrets:
              names = ", ".join(sorted(item.get("name", "<unnamed>") for item in secrets))
              raise SystemExit(f"Refusing preview upload: isolated Worker has secrets: {names}")
          print("Verified isolated preview Worker has no secrets")
          PY
          else
            echo "Cloudflare secret-list request failed with HTTP ${status}" >&2
            exit 1
          fi

      - name: Bootstrap isolated preview Worker without a public route
        if: steps.preview-service.outputs.exists == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview-bootstrap.jsonc

      - name: Validate trusted version-preview configuration
        env:
          PREVIEW_ALIAS: ${{ steps.preview.outputs.preview_alias }}
        run: >-
          npx wrangler versions upload
          --dry-run
          --no-bundle
          --strict
          --config wrangler.version-preview.jsonc
          --preview-alias "$PREVIEW_ALIAS"

      - name: Upload preview version without promoting production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.preview_alias }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.state')
          current_sha=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          [[ "$state" == "open" ]]
          [[ "$current_sha" == "$HEAD_SHA" ]]

          npx wrangler versions upload \
            --no-bundle \
            --strict \
            --config wrangler.version-preview.jsonc \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "PR #${PR_NUMBER} ${HEAD_SHA}"

      - name: Publish PR comment and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.preview_alias }}
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://${PREVIEW_ALIAS}-__PREVIEW_WORKER__.sisyphus-org.workers.dev"
          body=$(printf '%s\n' \
            '## Cloudflare preview ready' \
            '' \
            "- URL: ${preview_url}" \
            "- Commit: \`${HEAD_SHA}\`" \
            '- Access: Tailscale exit node required' \
            '- Production deployment was not changed.')
          gh pr comment "$PR_NUMBER" --body "$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
