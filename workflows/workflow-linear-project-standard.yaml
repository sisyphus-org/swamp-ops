id: b558e0d8-3aaf-4305-9b14-5f5a29ccfb3e
name: linear-project-standard
description: >-
  Read-only plan for a Linear project hierarchy Project -> Milestones -> Issues
  -> Sub-issues from a committed manifest. Project Manager is the only writer.
tags:
  domain: project-management
  integration: linear
  safety: plan-only
inputs:
  manifest:
    type: string
    pattern: "^[a-z][a-z0-9-]{1,62}$"
    description: Manifest slug under manifests/linear/<slug>.json.
jobs:
  - name: main
    description: Plan the standard Linear hierarchy from a validated manifest.
    steps:
      - name: reconcile
        description: >-
          Read current project hierarchy and emit a bounded reconciliation plan.
        task:
          type: model_method
          modelIdOrName: linear-project-standard
          methodName: execute
          inputs:
            run: python3 scripts/linear_project_standard.py --manifest 'manifests/linear/${{ inputs.manifest }}.json' --mode plan
            workingDir: .
            timeout: 120000
            ignoreExitCode: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 1
version: 1
