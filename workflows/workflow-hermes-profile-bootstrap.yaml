id: 3f275d3d-8e42-4ccd-92bd-324f7cdb29e0
name: hermes-profile-bootstrap
description: >-
  Creates deterministic Hermes profiles with role-specific credential boundaries,
  universal source routing, ru STT, and explicit activation/verification gates.
  The default source role installs the routing plugin/skill and has no Linear
  MCP or token injection. Plan mode is read-only; apply writes only inside the
  new profile directory and refuses existing profiles. Telegram tokens,
  LaunchDaemons and gateway restarts remain owner-controlled.
tags:
  domain: hermes-platform
  safety: scoped-writes-profiles-only
  owner: swe
inputs:
  profile:
    type: string
    pattern: "^[a-z][a-z0-9-]{1,30}$"
    description: Name of the Hermes profile to bootstrap.
  role:
    type: string
    enum: [general, broker, project-manager]
    default: general
    description: Bounded capability baseline for the profile.
jobs:
  - name: main
    description: >-
      Run the bootstrap script in plan mode first; a separate apply run is
      performed by the operator after reviewing the plan output.
    steps:
      - name: plan
        description: >-
          Read-only dry-run: report what would be created for the requested
          profile name.
        task:
          type: model_method
          modelIdOrName: hermes-profile-bootstrap
          methodName: execute
          inputs:
            run: python3 scripts/hermes_profile_bootstrap.py --profile '${{ inputs.profile }}' --role '${{ inputs.role }}' --mode plan
            workingDir: .
            timeout: 60000
            ignoreExitCode: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 1
version: 1
